# BIO559R Studio 1 single-cell RNA-seq environment
#
# Create:   mamba env create -f Bio559R-studio1-env.yml
# Or:       conda env create -f Bio559R-studio1-env.yml
# Activate: conda activate Bio559R-studio1-env
#
# This environment installs the packages needed for the Studio 1 RNA-seq
# workflow. It is a CPU baseline; configure CUDA/PyTorch separately for
# NVIDIA GPU work.
name: Bio559R-studio1-env
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core single-cell RNA-seq analysis packages
  - python=3.12
  - scanpy=1.12.4
  - anndata=0.13.4
  - scvi-tools=1.5.1
  - pytorch

  # Preprocessing and graph-analysis dependencies
  - scrublet=0.2.3
  - python-igraph
  - leidenalg
  - scikit-misc
  - umap-learn

  # Matrix I/O, plotting, and notebooks
  - numpy
  - pandas
  - scipy
  - h5py
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyterlab
  - ipykernel
  - nbformat
  - pip
