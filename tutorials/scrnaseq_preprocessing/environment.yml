# BIO559R two-sample scRNA-seq preprocessing environment
#
# Create:   mamba env create -f tutorials/scrnaseq_preprocessing/environment.yml
# Or:       conda env create -f tutorials/scrnaseq_preprocessing/environment.yml
# Activate: conda activate bio559r-scrnaseq
# Launch:   jupyter lab tutorials/scrnaseq_preprocessing/
#
# `scverse` is a scientific software ecosystem, not a standalone conda-forge
# package. This environment installs its core Python packages explicitly:
# Scanpy and AnnData. It also includes Scrublet for optional doublet scoring.
name: bio559r-scrnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core scverse analysis stack
  - python=3.11
  # These pins are the current Conda-forge builds compatible with Python 3.11.
  - scanpy=1.11.5
  - anndata=0.12.8

  # Two-sample preprocessing, 10x HDF5 input, optional doublet scoring, and plots
  - numpy
  - pandas
  - scipy
  - h5py
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-misc
  - scrublet=0.2.3
  - python-igraph
  - leidenalg

  # Notebook runtime and validation
  - jupyterlab
  - ipykernel
  - nbformat
  - nbclient
  - pip
